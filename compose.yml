services:
  trader:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: prog_stock:latest
    container_name: prog_stock
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      RUN_MODE: ${RUN_MODE:-paper}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["--mode", "${RUN_MODE:-paper}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/data/prog_stock.db').execute('SELECT 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
