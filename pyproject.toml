[project]
name = "prog_stock"
version = "0.1.0"
description = "Korean stock automated trading system (CAN SLIM + SEPA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-kis>=2.1.0",
    "OpenDartReader>=0.2.5",
    "pykrx>=1.0.45",
    "exchange-calendars>=4.5.0",
    "vectorbt>=0.26.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "apscheduler>=3.10.4",
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
aws = [
    "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prog_stock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
